<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f4e8">
  <title>کارت دعوت عروسی</title>
  <style>
  /* --- استایل‌های مربوط به سوال پخش آهنگ --- */
    #musicPrompt p {
      font-size: clamp(17px, 2.2vw, 22px);
      font-weight: 600;
      color: #5f4b12;
      margin-top: 0;
      margin-bottom: 20px;
    }
    .prompt-buttons {
      display: flex;
      gap: 15px;
      justify-content: center;
    }
    .music-btn {
      min-width: 100px;
      padding: 10px 24px;
      border: none;
      border-radius: 999px;
      color: white;
      cursor: pointer;
      font-size: clamp(16px, 2vw, 20px);
      font-weight: 600;
      transition: transform .25s ease, box-shadow .25s ease;
    }
    .music-btn:hover {
      transform: translateY(-2px);
    }
    .music-btn:active {
      transform: translateY(1px) scale(.99);
    }
    .btn-yes {
      background: #4caf50;
      box-shadow: 0 6px 15px rgba(76, 175, 80, 0.3);
    }
    .btn-yes:hover {
      box-shadow: 0 10px 20px rgba(76, 175, 80, 0.4);
    }
    .btn-no {
      background: #f44336;
      box-shadow: 0 6px 15px rgba(244, 67, 54, 0.3);
    }
    .btn-no:hover {
      box-shadow: 0 10px 20px rgba(244, 67, 54, 0.4);
    }

    :root {
      --gold: #b99a38;
      --gold-dark: #8f7424;
      --paper: #f8f4e8;
      --ui-bg: rgba(255,255,255,.78);
      --ui-border: rgba(126,100,28,.24);
      --shadow: 0 12px 40px rgba(77, 57, 13, .16);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--paper);
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, sans-serif;
      overscroll-behavior: none;
      touch-action: manipulation;
    }

    button {
      font: inherit;
    }

    #app {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: var(--paper);
    }

    .background {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      z-index: 0;
      user-select: none;
      pointer-events: none;
    }

    .stage {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      z-index: 1;
    }

    /*
      The artwork is 1080 x 1920. This wrapper preserves that exact
      composition while scaling it to fit the user's screen.
    */
    .artboard {
      position: absolute;
      width: min(100vw, calc(100dvh * 0.5625));
      height: min(100dvh, calc(100vw * 1.7777777778));
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      aspect-ratio: 1080 / 1920;
    }

	.page {
	  position: absolute;
	  inset: 0;
	  opacity: 0;
	  visibility: hidden;
	  pointer-events: none;
	  /* صفحه کمی پایین‌تر قرار می‌گیره */
	  transform: translateY(20px); 
	  /* ترنزیشن حرکت (transform) هم اضافه شد */
	  transition: opacity 1000ms ease, visibility 1000ms ease, transform 1000ms ease;
	}

	.page.active {
	  opacity: 1;
	  visibility: visible;
	  pointer-events: auto;
	  /* صفحه به جای اصلی خودش برمی‌گرده */
	  transform: translateY(0);
	}

    .layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .layer svg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }

    /* ---------- Opening screen ---------- */

    #intro {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      background: var(--paper);
      transition: opacity 900ms ease, visibility 900ms ease;
    }

    #intro.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /*.intro-card {
      width: min(76vw, 430px);
      aspect-ratio: 1 / .72;
      display: grid;
      place-items: center;
      padding: 28px;
      border: 1px solid var(--ui-border);
      border-radius: 28px;
      background: rgba(255,255,255,.58);
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      text-align: center;
    }*/

	.intro-card {
      width: min(85vw, 430px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px;
      border: 1px solid var(--ui-border);
      border-radius: 28px;
      background: rgba(255,255,255,.58);
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      text-align: center;
    }

	
    .load-button {
      min-width: 235px;
      min-height: 64px;
      padding: 14px 28px;
      border: 1px solid rgba(116, 87, 16, .35);
      border-radius: 999px;
      color: #5f4b12;
      background: linear-gradient(135deg, #cdb35a, #f0dc7a, #b3922f);
      box-shadow: 0 8px 25px rgba(120, 93, 21, .18);
      cursor: pointer;
      font-size: clamp(17px, 2.2vw, 22px);
      font-weight: 600;
      transition: transform .25s ease, box-shadow .25s ease;
    }

    .load-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(120, 93, 21, .23);
    }

    .load-button:active {
      transform: translateY(1px) scale(.99);
    }

    /* ---------- Map button (page 3) ---------- */

    .map-button-art {
      cursor: pointer;
    }

    /* ---------- Navigation ---------- */
    /* Placed near the bottom edge, clear of artwork/text, per request. */

    .nav-arrow {
      position: absolute;
      z-index: 10;
      bottom: 4.2%;
      width: clamp(42px, 6.2vw, 62px);
      height: clamp(42px, 6.2vw, 62px);
      border: 1px solid rgba(110, 85, 18, .2);
      border-radius: 50%;
      color: #6f5a17;
      background: rgba(255,255,255,.62);
      backdrop-filter: blur(7px);
      -webkit-backdrop-filter: blur(7px);
      box-shadow: 0 6px 18px rgba(72, 53, 11, .11);
      cursor: pointer;
      opacity: 0;
      transform: scale(.85);
      transition: opacity .45s ease, transform .45s ease, background .25s ease;
    }

    .page.active .nav-arrow {
      opacity: 1;
      transform: scale(1);
    }

    .nav-arrow:hover {
      background: rgba(255,255,255,.86);
    }

    .nav-arrow.right {
      right: 6%;
    }

    .nav-arrow.left {
      left: 6%;
    }

    .nav-arrow span {
      display: inline-block;
      font-size: 26px;
      line-height: 1;
    }

    /* ---------- Close / map modal ---------- */

    .close-card {
      position: absolute;
      z-index: 11;
      left: 3.8%;
      top: 3.5%;
      width: 42px;
      height: 42px;
      border: 1px solid rgba(110, 85, 18, .2);
      border-radius: 50%;
      background: rgba(255,255,255,.56);
      color: #6f5a17;
      cursor: pointer;
      opacity: .9;
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: grid;
      place-items: center;
      padding: 5vw;
      background: rgba(34, 27, 8, .48);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity .35s ease, visibility .35s ease;
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
    }

    .modal.open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .map-modal {
      position: relative;
      width: min(92vw, 760px);
      height: min(82vh, 700px);
      border-radius: 24px;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 30px 90px rgba(0,0,0,.28);
      display: flex;
      flex-direction: column;
    }

    .map-modal iframe {
      width: 100%;
      flex: 1 1 auto;
      display: block;
      border: 0;
    }

    .map-modal-footer {
      flex: 0 0 auto;
      padding: 10px 14px;
      text-align: center;
      background: #fff;
      border-top: 1px solid rgba(0,0,0,.08);
    }

    .map-modal-footer a {
      color: var(--gold-dark);
      font-size: 14px;
      text-decoration: none;
    }

    .map-modal-footer a:hover {
      text-decoration: underline;
    }

    .modal-close {
      position: absolute;
      z-index: 2;
      top: 12px;
      left: 12px;
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 50%;
      background: rgba(255,255,255,.9);
      color: #5c4914;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,.12);
      font-size: 22px;
    }

    @media (max-aspect-ratio: 9/16) {
      .artboard {
        width: 100vw;
        height: calc(100vw * 1.7777777778);
      }
    }

    @media (min-aspect-ratio: 9/16) {
      .artboard {
        height: 100dvh;
        width: calc(100dvh * .5625);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .page,
      #intro,
      .nav-arrow,
      .modal {
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <main id="app">

	<section id="intro" aria-label="شروع کارت دعوت">
      <div class="intro-card">
        <button id="loadInvitation" class="load-button" type="button">
          بارگذاری کارت دعوت
        </button>
        
        <!-- بخش جدید برای سوال پخش آهنگ -->
        <div id="musicPrompt" style="display: none;">
          <p>مایلید آهنگ پخش بشه؟</p>
          <div class="prompt-buttons">
            <button id="btnYesMusic" class="music-btn btn-yes" type="button">بله</button>
            <button id="btnNoMusic" class="music-btn btn-no" type="button">خیر</button>
          </div>
        </div>

      </div>
    </section>

    <div class="stage" aria-live="polite">
      <img class="background" src="background.png" alt="" aria-hidden="true">

      <div class="artboard">

        <!-- PAGE 1 -->
        <section id="page1" class="page" aria-label="صفحه اول">
          <div id="p1Layer" class="layer"></div>
        </section>

        <!-- PAGE 2 -->
        <section id="page2" class="page" aria-label="صفحه دوم">
          <div id="p2LineLayer" class="layer"></div>
          <div id="p2TextLayer" class="layer"></div>

          <button id="toPage3" class="nav-arrow right" type="button"
                  aria-label="رفتن به صفحه سوم">
            <span>&rarr;</span>
          </button>
        </section>

        <!-- PAGE 3 -->
        <section id="page3" class="page" aria-label="صفحه سوم">
          <div id="p3LineLayer" class="layer"></div>
          <div id="p3TextLayer" class="layer"></div>

          <button id="toPage2" class="nav-arrow right" type="button"
                  aria-label="بازگشت به صفحه دوم">
            <span>&larr;</span>
          </button>

          <button id="closeInvitation" class="close-card" type="button"
                  aria-label="بستن کارت دعوت">&times;</button>
        </section>

      </div>
    </div>

    <!-- Map modal -->
    <div id="mapModal" class="modal" role="dialog" aria-modal="true"
         aria-label="موقعیت تالار">
      <div class="map-modal">
        <button id="closeMap" class="modal-close" type="button"
                aria-label="بستن نقشه">&times;</button>
        <iframe
          src="https://balad.ir/embed?p=7hFb2iMw76Q4bm"
          title="مشاهده موقعیت تالار روی نقشه"
          allowfullscreen
          loading="lazy"></iframe>
        
        <div class="map-modal-footer" style="padding: 15px; text-align: center; background: #fff;">
          <p style="margin: 0 0 12px; font-weight: 600; color: #5f4b12; font-size: 15px;">مسیریابی با:</p>
          <div style="display: flex; justify-content: center; gap: 15px; flex-wrap: wrap;">
            
            <a href="https://www.google.com/maps/place/Minoram+Hall/@35.7610159,51.4794918,17z/data=!3m1!4b1!4m6!3m5!1s0x3f8e048272f6c557:0xb5046fa1352c2d9e!8m2!3d35.7610159!4d51.4794918!16s%2Fg%2F11d_yw2_2v?entry=ttu&g_ep=EgoyMDI2MDgxOS4wIKXMDSoASAFQAw%3D%3D" target="_blank" rel="noopener" style="display: flex; align-items: center; gap: 6px; color: #8f7424; font-weight: bold; text-decoration: none; padding: 6px 12px; border: 1px solid rgba(126,100,28,.24); border-radius: 8px; background: #fdfaf0;">
              <img src="googlemap.png" alt="گوگل‌مپ" style="width: 22px; height: 22px;">
              گوگل‌مپ
            </a>

			<a href="https://neshan.org/maps/places/9100b1153e361bdac9669e1c864bfd40#c35.761-51.481-18z-0p" target="_blank" rel="noopener" style="display: flex; align-items: center; gap: 6px; color: #8f7424; font-weight: bold; text-decoration: none; padding: 6px 12px; border: 1px solid rgba(126,100,28,.24); border-radius: 8px; background: #fdfaf0;">
              <img src="neshan.png" alt="نشان" style="width: 22px; height: 22px;">
              نشان
            </a>


            <a href="https://balad.ir/p/7hFb2iMw76Q4bm?preview=true#15/35.76207/51.48394" target="_blank" rel="noopener" style="display: flex; align-items: center; gap: 6px; color: #8f7424; font-weight: bold; text-decoration: none; padding: 6px 12px; border: 1px solid rgba(126,100,28,.24); border-radius: 8px; background: #fdfaf0;">
              <img src="balad.png" alt="بلد" style="width: 22px; height: 22px; border-radius: 4px;">
              بلد
            </a>

          </div>
        </div>
      </div>
    </div>
    <!--
      AUDIO PLACEHOLDER
      Later, put your music file in:
        audio/wedding.mp3
      Then set MUSIC_SRC in the script below.
      Browsers generally allow audio playback after the user clicks
      "بارگذاری کارت دعوت", which is why the audio hook starts there.
    -->

  </main>

      hideStroke(lowerLine);
      hideStroke(upperLine);
      hideClip(textGroup, "up");
    }
	
	function finishPage1() {
	  const { lowerLine, upperLine, textGroup } = state.p1;
	  finishStroke(lowerLine);
	  finishStroke(upperLine);
	  finishClip(textGroup);
	}

    async function playPage1(token) {
	  const { lowerLine, upperLine, textGroup } = state.p1;
	  // هر دو خط با هم و همزمان کشیده می‌شن
	  await Promise.all([
		drawStroke(lowerLine, { duration: 3500, delay: 1000 }).finished,
		drawStroke(upperLine, { duration: 3500, delay: 1000 }).finished
	  ]);
	  if (token !== playToken) return false;
	  await clipReveal(textGroup, { duration: 3000, direction: "up" }).finished;
	  return token === playToken;
	} 


    /* ================= PAGE 2 ================= */

    function setupPage2() {
      const lineSvg = svgFromString(SVG.p2line);
      const linePaths = [...lineSvg.querySelectorAll("path")];

      // p2_line-02.svg:
      // 0-12 = couple line art (13 paths)
      // 13 = lower vertical line
      // 14 = upper frame line
      const lowerBorder = linePaths[13];
      const upperBorder = linePaths[14];

      const couple = document.createElementNS("http://www.w3.org/2000/svg", "g");
      couple.classList.add("p2-couple");
      const coupleP = linePaths.slice(0, 13);
      coupleP.forEach(p => couple.appendChild(p));
      lineSvg.appendChild(couple);

      document.getElementById("p2LineLayer").appendChild(lineSvg);

      const textSvg = svgFromString(SVG.p2text);
      document.getElementById("p2TextLayer").appendChild(textSvg);
      const lineGroups = prepareTextLines(textSvg, 60);

      state.p2 = { lowerBorder, upperBorder, coupleP, lineGroups, played: false };
      resetPage2();
    }
	
	

    function resetPage2() {
      const { lowerBorder, upperBorder, coupleP, lineGroups } = state.p2;
      hideStroke(lowerBorder);
      hideStroke(upperBorder);
      hideOpacityGroup(coupleP);
      lineGroups.forEach(g => hideFade(g));
    }
	
	function finishPage2() {
	  const { lowerBorder, upperBorder, coupleP, lineGroups } = state.p2;
	  finishStroke(lowerBorder);
	  finishStroke(upperBorder);
	  finishOpacityGroup(coupleP);
	  lineGroups.forEach(finishFade);
	}

    async function playPage2(token) {
	  const { lowerBorder, upperBorder, coupleP, lineGroups } = state.p2;
	  // ۱) خط پایین کادر
	  await drawStroke(lowerBorder, { duration: 900 }).finished;
	  if (token !== playToken) return false;
	  // ۲) آرت (خطوط عروس‌وداماد) محو‌ظاهر می‌شود
	  await fadeGroupIn(coupleP, { duration: 2000});
	  if (token !== playToken) return false;
	  // ۳) خط بالای کادر
	  await drawStroke(upperBorder, { duration: 1700 }).finished;
	  if (token !== playToken) return false;
	  // ۴) نوشته‌ها بلافاصله و سریع‌تر شروع می‌کنند
	  await revealLines(lineGroups, 7000);
	  return token === playToken;
	}
    /* ================= PAGE 3 ================= */

    function setupPage3() {
      const lineSvg = svgFromString(SVG.p3line);
      const leafPaths = [...lineSvg.querySelectorAll("path")];
      document.getElementById("p3LineLayer").appendChild(lineSvg);

      const textSvg = svgFromString(SVG.p3text);
      document.getElementById("p3TextLayer").appendChild(textSvg);

      // The invitation text occupies the upper portion of the artwork;
      // the button (rect + its label paths) sits lower, around y > 1070.
      const lineGroups = prepareTextLines(textSvg, 60, node => {
        if (node.tagName.toLowerCase() === "rect") return false;
        const b = node.getBBox();
        return b.y < 1050;
      });

      const buttonBg = textSvg.querySelector("rect.cls-2");
      const textPaths = [...textSvg.querySelectorAll("path")].filter(p => {
        const b = p.getBBox();
        return b.y > 1070;
      });

      const buttonGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
      buttonGroup.classList.add("map-button-art");
      if (buttonBg) buttonGroup.appendChild(buttonBg);
      textPaths.forEach(p => buttonGroup.appendChild(p));
      textSvg.appendChild(buttonGroup);

      buttonGroup.setAttribute("role", "button");
      buttonGroup.setAttribute("tabindex", "0");
      buttonGroup.setAttribute("aria-label", "نمایش موقعیت تالار روی نقشه");
      buttonGroup.addEventListener("click", openMap);
      buttonGroup.addEventListener("keydown", e => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          openMap();
        }
      });

      state.p3 = { leafPaths, lineGroups, buttonGroup, played: false };
      resetPage3();
    }

    function resetPage3() {
      const { leafPaths, lineGroups, buttonGroup } = state.p3;
      leafPaths.forEach(p => hideClip(p, "right"));
      lineGroups.forEach(g => hideFade(g));
      hideScale(buttonGroup);
    }
	
	function finishPage3() {
	  const { leafPaths, lineGroups, buttonGroup } = state.p3;
	  leafPaths.forEach(finishClip);
	  lineGroups.forEach(finishFade);
	  finishScale(buttonGroup);
	}

    async function playPage3(token) {
	  const { leafPaths, lineGroups, buttonGroup } = state.p3;
	  const leafTimings = [
		{ duration: 1600, delay: 0 },
		{ duration: 1300, delay: 350 },
		{ duration: 950, delay: 750 },
		{ duration: 800, delay: 950 }
	  ];
	  const leafAnims = leafPaths.map((p, i) =>
		clipReveal(p, { direction: "right", ...(leafTimings[i] || { duration: 900, delay: 0 }) })
	  );
	  await Promise.all(leafAnims.map(a => a.finished));
	  if (token !== playToken) return false;

	  await revealLines(lineGroups, 3200);
	  if (token !== playToken) return false;

	  await openFromMiddle(buttonGroup, { duration: 900 }).finished;
	  return token === playToken;
	}

    /* ================= Navigation / lifecycle ================= */

    function showPage(n, options = { auto: true }) {
	  playToken += 1;
	  const token = playToken;
	  clearTimeout(pageTimer);

	  Object.values(pages).forEach(p => p.classList.remove("active"));
	  pages[n].classList.add("active");
	  currentPage = n;

	  if (n === 1) {
		if (state.p1.played) {
		  finishPage1();
		} else {
		  resetPage1();
		  playPage1(token).then(completed => { if (completed) state.p1.played = true; });
		}
		if (options.auto) pageTimer = setTimeout(() => showPage(2), d(TIMING.page1));
	  } else if (n === 2) {
		if (state.p2.played) {
		  finishPage2();
		} else {
		  resetPage2();
		  playPage2(token).then(completed => { if (completed) state.p2.played = true; });
		}
		if (options.auto) pageTimer = setTimeout(() => showPage(3), d(TIMING.page2));
	  } else if (n === 3) {
		if (state.p3.played) {
		  finishPage3();
		} else {
		  resetPage3();
		  playPage3(token).then(completed => { if (completed) state.p3.played = true; });
		}
	  }
	}

	function startInvitation() {
	  // دکمه بارگذاری مخفی و سوال آهنگ نمایش داده می‌شود
	  document.getElementById("loadInvitation").style.display = "none";
	  document.getElementById("musicPrompt").style.display = "block";
	}

	function proceedToCard(playAudio) {
	  if (started) return;
	  started = true;

	  if (playAudio) {
		prepareMusic();
		bgMusic.currentTime = 131; // پرش به دقیقه ۲ و ۱۱ ثانیه
		startMusic();
	  }

	  document.getElementById("intro").classList.add("hidden");
	  showPage(1);
	}

    function openMap() {
      document.getElementById("mapModal").classList.add("open");
    }

    function closeMap() {
      document.getElementById("mapModal").classList.remove("open");
    }

    function closeInvitation() {
	  playToken += 1;
	  clearTimeout(pageTimer);
	  Object.values(pages).forEach(p => p.classList.remove("active"));
	  document.getElementById("intro").classList.remove("hidden");
	  
	  document.getElementById("loadInvitation").style.display = "block";
      document.getElementById("musicPrompt").style.display = "none";
	  
	  started = false;
	  currentPage = 1;
	  if (state.p1) state.p1.played = false;
	  if (state.p2) state.p2.played = false;
	  if (state.p3) state.p3.played = false;
	  if (bgMusic && !bgMusic.paused) {
		bgMusic.pause();
		bgMusic.currentTime = 0;
	  }
	}

    document.getElementById("loadInvitation").addEventListener("click", startInvitation);
    document.getElementById("btnYesMusic").addEventListener("click", () => proceedToCard(true));
    document.getElementById("btnNoMusic").addEventListener("click", () => proceedToCard(false));

    document.getElementById("toPage3").addEventListener("click", () => {
      showPage(3, { auto: false });
    });

    document.getElementById("toPage2").addEventListener("click", () => {
      showPage(2, { auto: false });
    });

    document.getElementById("closeInvitation").addEventListener("click", closeInvitation);

    document.getElementById("closeMap").addEventListener("click", closeMap);

    document.getElementById("mapModal").addEventListener("click", e => {
      if (e.target.id === "mapModal") closeMap();
    });

    document.addEventListener("keydown", e => {
      if (e.key === "Escape") {
        closeMap();
      }
    });

    // Build all artwork up front, in its hidden/pre-draw state, so it is
    // ready the instant each page becomes active.
    setupPage1();
    setupPage2();
    setupPage3();

    // Page 1 starts hidden until "بارگذاری کارت دعوت" is clicked.
    pages[1].classList.remove("active");
	
  </script>
</html>
